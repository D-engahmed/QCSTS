services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ../.env.production
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${QCSTS_BACKEND_IMAGE:?QCSTS_BACKEND_IMAGE is required}
    restart: "no"
    env_file:
      - ../.env.production
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${QCSTS_BACKEND_IMAGE:?QCSTS_BACKEND_IMAGE is required}
    volumes:
      - static_data:/app/staticfiles
    restart: unless-stopped
    env_file:
      - ../.env.production
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --deploy"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    image: ${QCSTS_BACKEND_IMAGE:?QCSTS_BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ../.env.production
    command: celery -A config worker --loglevel=INFO --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully

  celery-beat:
    image: ${QCSTS_BACKEND_IMAGE:?QCSTS_BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ../.env.production
    command: celery -A config beat --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${QCSTS_FRONTEND_IMAGE:?QCSTS_FRONTEND_IMAGE is required}
    restart: unless-stopped
    environment:
      PORT: "3000"
      QCSTS_API_URL: http://web:8000/api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_data:
