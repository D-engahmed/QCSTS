name: Production gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QCSTS
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: sqlite:///ci.sqlite3
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SECRET_KEY: ci-only-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: pip install -r requirements/test.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migration graph is synchronized
        run: python manage.py makemigrations --check --dry-run

      - name: Lint
        run: ruff check .

      - name: Run backend test suite with coverage
        run: pytest -q --cov=apps --cov=core --cov=services --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: QCSTS/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
