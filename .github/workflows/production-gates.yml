name: QCSTS CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qcsts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qcsts_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qcsts_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: QCSTS
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qcsts_ci
      CI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qcsts_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      DJANGO_SECRET_KEY: ci-only-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: QCSTS/requirements/test.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Verify installed Python dependencies
        run: python -m pip check

      - name: Django application system checks
        run: python manage.py check

      - name: Production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-production-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
          DEBUG: "False"
          ALLOWED_HOSTS: app.example.com
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qcsts_ci
          REDIS_URL: redis://127.0.0.1:6379/0
          PAYMOB_HMAC_SECRET: ci-paymob-hmac-secret
        run: python manage.py check --deploy

      - name: Migration graph is synchronized
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations against PostgreSQL
        run: python manage.py migrate --noinput

      - name: Lint
        run: ruff check .

      - name: Run backend tests with coverage
        run: >
          pytest -q
          --cov=apps
          --cov=core
          --cov=services
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run check:no-demo
      - run: npm run typecheck
      - run: npm run build
      - name: Start production frontend
        run: npm start > /tmp/qcsts-next.log 2>&1 &
      - run: node scripts/smoke-routes.mjs

  container:
    name: Container build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./QCSTS
          file: ./QCSTS/docker/Dockerfile
          push: false
          tags: qcsts-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: qcsts-frontend:ci

  publish:
    name: Publish images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./QCSTS
          file: ./QCSTS/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qcsts-backend:${{ github.sha }}

      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qcsts-frontend:${{ github.sha }}
